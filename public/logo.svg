  <g transform="translate(220, 180)">
    <rect x="0" y="0" width="100" height="4" fill="#DC2626" rx="2" />
    <rect x="100" y="0" width="100" height="4" fill="#159447" rx="2" />
    <rect x="200" y="0" width="100" height="4" fill="#EAB308" rx="2" />
    <rect x="300" y="0" width="105" height="4" fill="#0B4FA2" rx="2" />
