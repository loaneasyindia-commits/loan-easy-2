      <path d="M 6 18 L 18 18 M 8 18 L 8 10 M 12 18 L 12 10 M 16 18 L 16 10 M 6 10 L 12 6 L 18 10" stroke="#159447" stroke-width="1.5" fill="none" />
      <text x="26" y="10" fill="#102A56" font-size="9" font-weight="bold" font-family="sans-serif">All Leading</text>
      <text x="26" y="18" fill="#102A56" font-size="9" font-weight="bold" font-family="sans-serif">Banks</text>
    </g>

    <line x1="210" y1="2" x2="210" y2="22" stroke="#E2E8F0" stroke-width="1.5" />

    <g transform="translate(220, 0)">
      <rect x="2" y="2" width="20" height="20" rx="4" fill="#FEF3C7" />
      <path d="M 7 7 L 17 7 M 7 12 L 17 12 M 7 17 L 13 17" stroke="#D97706" stroke-width="2" fill="none" />
      <text x="26" y="10" fill="#102A56" font-size="9" font-weight="bold" font-family="sans-serif">All Loan</text>
      <text x="26" y="18" fill="#102A56" font-size="9" font-weight="bold" font-family="sans-serif">Options</text>
    </g>

    <line x1="315" y1="2" x2="315" y2="22" stroke="#E2E8F0" stroke-width="1.5" />

    <g transform="translate(325, 0)">
      <circle cx="12" cy="12" r="10" fill="#DBEAFE" />
      <path d="M 7 16 C 7 12 17 12 17 16 M 12 6 A 3 3 0 1 0 12 6 A 3 3 0 1 0 12 6" stroke="#0B4FA2" stroke-width="1.5" fill="none" />
      <text x="26" y="10" fill="#102A56" font-size="9" font-weight="bold" font-family="sans-serif">Personal</text>
      <text x="26" y="18" fill="#102A56" font-size="9" font-weight="bold" font-family="sans-serif">Assistance</text>
