      <rect x="3" y="3" width="110" height="66" rx="12" fill="none" stroke="#60A5FA" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <path d="M 0 16 C 35 8, 80 8, 116 16" fill="none" stroke="#0B3C7A" stroke-width="2" />
