        <line x1="12" y1="0" x2="12" y2="40" stroke="#86EFAC" stroke-width="2" />
      </g>
      <g transform="rotate(-20 40 45)">
        <rect x="0" y="0" width="75" height="40" rx="3" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2" />
        <line x1="12" y1="0" x2="12" y2="40" stroke="#86EFAC" stroke-width="2" />
      </g>
      <g transform="rotate(-10 40 45)">
        <rect x="0" y="0" width="75" height="40" rx="3" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2" />
        <line x1="12" y1="0" x2="12" y2="40" stroke="#86EFAC" stroke-width="2" />
      </g>
      <g transform="rotate(0 40 45)">
        <rect x="0" y="0" width="75" height="40" rx="3" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2" />
        <line x1="12" y1="0" x2="12" y2="40" stroke="#86EFAC" stroke-width="2" />
      </g>
      <g transform="rotate(10 40 45)">
        <rect x="0" y="0" width="75" height="40" rx="3" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2" />
        <line x1="12" y1="0" x2="12" y2="40" stroke="#86EFAC" stroke-width="2" />
      </g>
      <g transform="rotate(20 40 45)">
        <rect x="0" y="0" width="75" height="40" rx="3" fill="#FEFCE8" stroke="#159447" stroke-width="1.5" />
