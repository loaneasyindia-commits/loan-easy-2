      <path d="M 7 12 L 17 12 M 13 8 L 17 12 L 13 16" stroke="#DC2626" stroke-width="2" fill="none" />
      <text x="26" y="10" fill="#102A56" font-size="9" font-weight="bold" font-family="sans-serif">Quick</text>
      <text x="26" y="18" fill="#102A56" font-size="9" font-weight="bold" font-family="sans-serif">Process</text>
    </g>

    <line x1="95" y1="2" x2="95" y2="22" stroke="#E2E8F0" stroke-width="1.5" />

