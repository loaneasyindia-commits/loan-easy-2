      <path d="M 116 26 L 132 26 C 138 26, 142 30, 142 36 C 142 42, 138 46, 132 46 L 116 46 Z" fill="#0B3C7A" stroke="#2563EB" stroke-width="1.5" />
      <circle cx="132" cy="36" r="5" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
      <circle cx="132" cy="36" r="2" fill="#FFFFFF" />
    </g>
