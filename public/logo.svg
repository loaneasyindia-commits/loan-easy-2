    <path d="M 100 22 A 75 75 0 0 0 28 95" fill="none" stroke="#DC2626" stroke-width="6" stroke-linecap="round" />
    <path d="M 105 22 A 75 75 0 0 1 172 95" fill="none" stroke="#159447" stroke-width="6" stroke-linecap="round" />
    <path d="M 172 105 A 75 75 0 0 1 105 178" fill="none" stroke="#EAB308" stroke-width="6" stroke-linecap="round" />
    <path d="M 28 105 A 75 75 0 0 0 95 178" fill="none" stroke="#0B4FA2" stroke-width="6" stroke-linecap="round" />

    {/* 4 ₹ Symbols */}
    <text x="96" y="18" fill="#159447" font-size="16" font-weight="bold" font-family="sans-serif">₹</text>
    <text x="178" y="105" fill="#EAB308" font-size="16" font-weight="bold" font-family="sans-serif">₹</text>
    <text x="96" y="194" fill="#0B4FA2" font-size="16" font-weight="bold" font-family="sans-serif">₹</text>
    <text x="10" y="105" fill="#DC2626" font-size="16" font-weight="bold" font-family="sans-serif">₹</text>

